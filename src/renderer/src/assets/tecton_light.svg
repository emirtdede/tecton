<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="darkerSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>   <stop offset="25%" stop-color="#94A3B8"/>  <stop offset="50%" stop-color="#334155"/>  <stop offset="75%" stop-color="#64748B"/>  <stop offset="100%" stop-color="#1E293B"/> </linearGradient>

    <pattern id="gridDarker" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.25"/>
      <path d="M 40 1 L 0 1 0 41" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>
    </pattern>

    <linearGradient id="gradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/> 
      <stop offset="100%" stop-color="#94A3B8"/> 
    </linearGradient>
    
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/> 
      <stop offset="100%" stop-color="#0284C7"/> 
    </linearGradient>
    
    <linearGradient id="gradCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/> 
      <stop offset="100%" stop-color="#090A0F"/> 
    </linearGradient>
  </defs>

  <rect width="800" height="800" rx="160" fill="url(#darkerSteel)" stroke="#475569" stroke-width="4" stroke-opacity="0.6"/>
  <rect width="800" height="800" rx="160" fill="url(#gridDarker)"/>

  <circle cx="400" cy="400" r="180" fill="#0284C7" opacity="0.25" filter="url(#glow)"/>

  <rect x="340" y="220" width="120" height="360" rx="30" fill="url(#gradCenter)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <rect x="180" y="220" width="190" height="120" rx="30" fill="url(#gradBlue)" opacity="0.9" stroke="#E0F2FE" stroke-width="1.5" stroke-opacity="0.2"/>
  
  <rect x="430" y="220" width="190" height="120" rx="30" fill="url(#gradWhite)" opacity="0.9" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>

</svg>
