<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecton Tarama</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-app-region: drag; /* Allows dragging the window */
    }
    .splash-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Logo Wrapper and Scanner Anim */
    .logo-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 44px;
      overflow: hidden;
    }
    #logo-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .laser-line {
      height: 2px;
      width: 100%;
      background: #22D3EE;
      box-shadow: 0 0 15px 3px #22D3EE;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      pointer-events: none;
      animation: laser-scan 2.5s ease-in-out infinite alternate;
    }
    @keyframes laser-scan {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(218px); /* Container height (220px) - laser height (2px) */
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-wrapper">
      <img id="logo-img" src="" alt="Tecton Logo">
      <div class="laser-line"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme') || 'dark';
    const logoImg = document.getElementById('logo-img');
    // Same mapping as the renderer sidebar (index.css): the light theme uses
    // the dark badge for contrast against a light background, and vice versa.
    if (theme === 'light') {
      logoImg.src = '../../tecton_assets/tecton-tray-dark.svg';
    } else {
      logoImg.src = '../../tecton_assets/tecton-tray-light.svg';
    }
  </script>
</body>
</html>
